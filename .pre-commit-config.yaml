repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ['-ll']
        files: \.py$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: \.secrets\.baseline$

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (CVE scan)
        entry: pip-audit
        language: system
        args: ["--desc", "on", "--skip-editable"]
        pass_filenames: false

      - id: frontend-lint
        name: frontend-lint
        entry: cmd /c "cd frontend && npm run lint"
        language: system
        files: frontend/src/.*\.(jsx|js)$
        pass_filenames: false