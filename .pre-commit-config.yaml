repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ['-ll']
        files: \.py$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: \.secrets\.baseline$

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: ["--desc", "on", "--skip-editable"]

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend-lint
        entry: bash -c "cd frontend && npm ci --no-audit --no-fund && npm run lint"
        language: system
        files: frontend/.*\.(jsx|js|mjs)$
        pass_filenames: false